version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: npm
    directory: "web"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
