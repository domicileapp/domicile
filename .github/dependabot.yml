version: 2
updates:
  - package-ecosystem: "docker-compose"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directory: "/tools/docker-compose"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/web"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      prod-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
      npm:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
    groups:
      gomod:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
