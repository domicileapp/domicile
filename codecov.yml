ignore:
  - "**/store_mock.go"
  - "docs/**"

coverage:
  status:
    patch: true
    project:
      default:
        target: auto
        threshold: 1%

comment:
  layout: "header, diff, flags, components"

component_management:
  individual_components:
    - component_id: web
      name: Web app
      paths:
        - web/**
    - component_id: scraper
      name: Scraper
      paths:
        - scraper/**
    - component_id: scraper_extension
      name: Scraper chrome extension
      paths:
        - chrome-extension/**
    - component_id: api
      name: API
      paths:
        - "*.go"
        - "**/*.go"
